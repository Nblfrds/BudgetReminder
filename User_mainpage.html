<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mainpage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Budget Reminder</h1>
    <h2>By TheZafRun & SleepyGary</h2>
    
    <button id="IncreaseBudgetButton">Increase Budget</button>
    <div id="BudgetIncreaseModal" class="Modal" style="display: none;">
        <div class="modal-content">
        <span class="close">&times;</span>
        <form id="BudgetIncreaseForm">
            <input type="number" id="budgetIncrease" placeholder="Enter the amount to increase your budget">
            <input type="text" id="increasereason" placeholder="Enter the reason for the increase">
            <button id="SubmitIncrease">Submit</button>
        </form>
        </div>
    </div>
    <button id="DecreaseBudgetButton">Decrease Budget</button>
    <div id="BudgetDecreaseModal" class="Modal" style="display: none;">
        <div class="modal-content">
        <span class="close">&times;</span>
        <form id="BudgetDecreaseForm">
            <input type="number" id="budgetDecrease" placeholder="Enter the amount to decrease your budget">
            <input type="text" id="decreasereason" placeholder="Enter the reason for the decrease">
            <button id="SubmitDecrease">Submit</button>
        </form>
        </div>
    </div>
    <div id="BudgetHistoryModal" class="Modal">
        <div class="modal-content">
        <h3>Budget History</h3>
        <ul id="BudgetHistoryList"></ul>
        </div>
    </div>
    <div id="BudgetTypeDisplay" class="Modal">
        <div class="modal-content">
        <h3>Budget Type</h3>
        <p></p>
        </div>
    </div>
    <script>
        var userData = JSON.parse(localStorage.getItem("userData"));
        var username = userData ? userData.username : null;
        var currentBudget = userData ? userData.currentBudget : null;
        var budgetType = userData ? userData.budgetType : null; 
        var btnIncrease = document.getElementById("IncreaseBudgetButton");
        var btnDecrease = document.getElementById("DecreaseBudgetButton");
        var spanIncrease = document.getElementById("BudgetIncreaseModal").getElementsByClassName("close")[0];
        var spanDecrease = document.getElementById("BudgetDecreaseModal").getElementsByClassName("close")[0];
        
        
        if (!userData.budgetHistory) {
            userData.budgetHistory = [];
        }

        btnIncrease.onclick = function() {
            document.getElementById("BudgetIncreaseModal").style.display = "block";
        }
        btnDecrease.onclick = function() {
            document.getElementById("BudgetDecreaseModal").style.display = "block";
        }
        spanIncrease.onclick = function() {
            document.getElementById("BudgetIncreaseModal").style.display = "none";
        }  
        spanDecrease.onclick = function() {
                document.getElementById("BudgetDecreaseModal").style.display = "none";
            }

        if (username) {
            document.write("<h3>Welcome, " + username + "!</h3>");
        } else {
            document.write("<h3>Welcome, Guest!</h3>");
        }
        document.write("<p>Current Budget: RM" + currentBudget + "</p>");

        var increaseModal = document.getElementById("BudgetIncreaseModal");
        var decreaseModal = document.getElementById("BudgetDecreaseModal");
        
        document.getElementById("SubmitIncrease").addEventListener("click", function(event) {
            event.preventDefault();
            var budgetIncrease = parseFloat(document.getElementById("budgetIncrease").value);
            var increasereason = document.getElementById("increasereason").value;

            if (!isNaN(budgetIncrease) && increasereason) {
                currentBudget += budgetIncrease;
                userData.currentBudget = currentBudget;
                var HistoryEntry = "Increased by RM" + budgetIncrease + " for reason: " + increasereason;    
                userData.budgetHistory.push(HistoryEntry);
                localStorage.setItem("userData", JSON.stringify(userData));
                alert("Budget increased by RM" + budgetIncrease + " for reason: " + increasereason);
                increaseModal.style.display = "none";
                location.reload(); // Refresh the page to show updated budget
            } else {
                alert("Please enter a valid amount and reason.");
            }
        });
        document.getElementById("SubmitDecrease").addEventListener("click", function(event) {
            event.preventDefault();
            var budgetDecrease = parseFloat(document.getElementById("budgetDecrease").value);
            var decreasereason = document.getElementById("decreasereason").value;

            if (!isNaN(budgetDecrease) && decreasereason) {
                currentBudget -= budgetDecrease;
                userData.currentBudget = currentBudget;
                var HistoryEntry = "Decreased by RM" + budgetDecrease + " for reason: " + decreasereason;
                userData.budgetHistory.push(HistoryEntry);
                localStorage.setItem("userData", JSON.stringify(userData));
                alert("Budget decreased by RM" + budgetDecrease + " for reason: " + decreasereason);
                decreaseModal.style.display = "none";
                location.reload(); // Refresh the page to show updated budget
            } else {
                alert("Please enter a valid amount and reason.");
            }
        });
        if (userData && userData.budgetHistory) {
            var budgetHistoryList = document.getElementById("BudgetHistoryList");
            userData.budgetHistory.forEach(function(entry) {
                var listItem = document.createElement("li");
                listItem.textContent = entry;
                budgetHistoryList.appendChild(listItem);
            });
        }

        if (username) {
            document.title = "Welcome, " + username;
        } else {
            document.title = "Welcome, Guest";
        }
        if (budgetType) {
            document.getElementById("BudgetTypeDisplay").getElementsByTagName("p")[0].textContent = "Your budget type is: " + budgetType;
        } else {
            document.getElementById("BudgetTypeDisplay").getElementsByTagName("p")[0].textContent = "No budget type selected.";
        }

        function BudgetClockMonitor() {
            var now = new Date();
            var dayName = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            var CurrentDay = dayName[now.getDay()];
            var CurrentMonth = now.getMonth();
            var currentDate = now.getDate();

            var timetracker = document.getElementById("LiveTimeTracker");
            if (timetracker){
                if(budgetType === "weekly"){
                    timetracker.textContent = "Today is: " + CurrentDay + ", " + now.toLocaleTimeString();
                } else if (budgetType === "monthly") {
                    var currentWeekOfMonth = Math.ceil(currentDate / 7);
                    timetracker.textContent = "Today is: Week " + currentWeekOfMonth + " of " + (CurrentMonth + 1) + ", " + now.toLocaleTimeString();
                }
            }
            let isPeriodEnd = false;
            if (budgetType === "weekly" && CurrentDay === "Sunday" && now.getHours() === 23 && now.getMinutes() === 59 && now.getSeconds() === 59) {
                isPeriodEnd = true;
            } else if (budgetType === "monthly") {
                var lastDayOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
                if (currentDate === lastDayOfMonth && now.getHours() === 23 && now.getMinutes() === 59 && now.getSeconds() === 59) {
                    isPeriodEnd = true;
                }
            }
            if(isPeriodEnd){ {
                alert("Your budget period has ended. Please review your budget and make necessary adjustments.");
                if (currentBudget > 0){
                    alert("You have saved RM"+currentBudget+". You can insert this amounts into your saving account");
                } else if (currentBudget < 0){
                    alert("You have overspent by RM"+Math.abs(currentBudget)+". Please review your spending more thoughtfully");
                }
            }
        }
    }
    setInterval(BudgetClockMonitor, 1000); // Check every second
    BudgetClockMonitor(); // Initial check
    </script>
</body>
</html>
